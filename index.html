<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plant Catalog</title>
<meta name="description" content="Rare aroids and corms: browse what's available, see photos, and ask about any plant.">
<meta name="theme-color" content="#f2f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plant Catalog">
<meta property="og:title" content="Plant Catalog">
<meta property="og:description" content="Rare aroids and corms: see what's available right now.">
<meta property="og:image" content="icons/icon-512.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first specimen-label list under a sticky header; tabs switch Plants / Corms / Counts. */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --sunk:#e7ebe4; --line:#d3dbd0;
  --fg:#17211b; --muted:#5b685f; --leaf:#2c6e49; --leaf-soft:#dcebe1;
  --accent:#a8326a; --accent-fg:#ffffff; --hold:#9a6a12; --hold-soft:#f5e9cf; --nfs-soft:#e9ece8;
  --sw-green:#3f7d4f; --sw-albo:#fbfaf3; --sw-aurea:#e7c63d; --sw-pink:#ec8fb2; --sw-mint:#a9dcc2; --sw-purple:#7c4a86;
  --shadow:0 1px 2px rgba(23,33,27,.06),0 4px 14px rgba(23,33,27,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18201b; --sunk:#1f2923; --line:#2c3831;
  --fg:#e6ece6; --muted:#9aa89e; --leaf:#7cc79a; --leaf-soft:#1f3a2a;
  --accent:#e87aa9; --accent-fg:#22101a; --hold:#e2b45a; --hold-soft:#3a2f17; --nfs-soft:#232c26;
  --sw-green:#4f9a63; --sw-albo:#f2f1ea; --sw-aurea:#e2c040; --sw-pink:#ef9cbc; --sw-mint:#9fd8bb; --sw-purple:#a879b3;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201b; --sunk:#1f2923; --line:#2c3831;
  --fg:#e6ece6; --muted:#9aa89e; --leaf:#7cc79a; --leaf-soft:#1f3a2a;
  --accent:#e87aa9; --accent-fg:#22101a; --hold:#e2b45a; --hold-soft:#3a2f17; --nfs-soft:#232c26;
  --sw-green:#4f9a63; --sw-albo:#f2f1ea; --sw-aurea:#e2c040; --sw-pink:#ef9cbc; --sw-mint:#9fd8bb; --sw-purple:#a879b3;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:14px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 1.65rem/1.05 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand small{color:var(--muted);font-size:.8rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:700;font-size:.92rem;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tabs .n{font:500 .78rem var(--f-mono);color:var(--muted);margin-left:4px}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.search input::placeholder{color:var(--muted)}
.toggle{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:.85rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--leaf)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.84rem;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

main .wrap{padding-block:14px 40px}
.summary{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.group{margin-top:18px}
.group h2{font:700 1.05rem/1.2 var(--f-display);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.group h2 .c{font:500 .78rem var(--f-mono);color:var(--muted);align-self:center}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;cursor:pointer}
.item:hover{border-color:var(--muted)}
.item .mid{min-width:0}
.item .t{font-weight:700;line-height:1.25}
.item .m{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.item .r{display:grid;justify-items:end;gap:4px}
.sku{font:500 .8rem var(--f-mono);letter-spacing:.02em;color:var(--muted)}
.pill{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px}
.pill.available{background:var(--leaf-soft);color:var(--leaf)}
.pill.hold{background:var(--hold-soft);color:var(--hold)}
.pill.nfs{background:var(--nfs-soft);color:var(--muted)}

/* Variegation swatch: a leaf disc split between green and the variegation colour. */
.sw{width:30px;height:30px;border-radius:50% 50% 50% 6px;border:1px solid var(--line);background:conic-gradient(var(--sw-green) 0 50%,var(--v,var(--sw-green)) 50% 100%);flex:none}
.sw.speck{background:radial-gradient(circle at 30% 35%,var(--sw-albo) 0 3px,transparent 3.5px),radial-gradient(circle at 65% 60%,var(--sw-albo) 0 2.5px,transparent 3px),radial-gradient(circle at 45% 75%,var(--sw-albo) 0 2px,transparent 2.5px),var(--sw-green)}

.empty{border:1px dashed var(--line);border-radius:12px;padding:24px 16px;text-align:center;color:var(--muted)}

/* Counts */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:700 1.5rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.bars{display:grid;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.bar{display:grid;grid-template-columns:minmax(0,9.5rem) 1fr 2.2rem;align-items:center;gap:10px;font-size:.88rem}
.bar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{display:block;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--leaf);border-radius:6px}
.bar.corm .fill{background:var(--hold)}
.bar .v{font:500 .82rem var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:.8rem;color:var(--muted);margin:6px 2px 0}

/* Detail sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:88%;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet .head{display:flex;gap:12px;align-items:center}
.sheet h3{font:700 1.4rem/1.15 var(--f-display);margin:0;text-wrap:balance}
.label{margin:14px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.label div{display:grid;grid-template-columns:7.5rem 1fr;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:.92rem}
.label div:first-child{border-top:0}
.label dt{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;align-self:center}
.label dd{margin:0}
.actions{display:grid;gap:8px;margin-top:16px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:11px;padding:12px 14px;font-weight:700;text-decoration:none;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.ask{margin-top:14px;display:grid;gap:8px}
.ask textarea{width:100%;min-height:88px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px;resize:vertical}
.ask p{margin:0;font-size:.84rem;color:var(--muted)}
.toast{font-size:.84rem;color:var(--leaf);min-height:1.2em}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--sunk);flex:none;display:block}
.item.has-photo{grid-template-columns:56px 1fr auto}
.cam{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:var(--muted)}
.gallery{position:relative;margin:0 -18px 14px;margin:0 calc(-1 * max(18px,env(safe-area-inset-left,0px))) 14px}
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--sunk)}
.strip::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:3/4;max-height:62vh;display:flex;align-items:center;justify-content:center;background:var(--sunk)}
.slide img,.slide video{width:100%;height:100%;object-fit:contain;display:block;max-width:100%}
.slide a{color:var(--fg);font-weight:700;text-align:center;padding:20px}
.count{position:absolute;right:12px;bottom:10px;font:500 .78rem var(--f-mono);background:rgba(10,14,12,.62);color:#fff;border-radius:999px;padding:3px 9px}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(10,14,12,.5);color:#fff;font-size:1.2rem;line-height:36px;cursor:pointer}
.gnav.prev{left:10px}.gnav.next{right:10px}
@media (hover:none){.gnav{display:none}}
.slide iframe{width:100%;height:100%;border:0;display:block}
.vid{position:relative;width:100%;height:100%;border:0;padding:0;background:transparent;cursor:pointer}
.vid img{width:100%;height:100%;object-fit:contain;display:block}
.vid .play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(10,14,12,.62);display:grid;place-items:center}
.vid .play::before{content:"";margin-left:5px;border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #fff}
.cam .vbadge{font-weight:700}
.live{display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--leaf)}
.live.stale::before{background:var(--hold)}
.install{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.88rem}
.install p{margin:0;flex:1}
.install button{border:0;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 6px}
.install .btn{font-size:.85rem;padding:8px 12px;color:var(--accent-fg);background:var(--accent)}
/* At a glance: headline numbers + one single-series bar list (leaf green, no legend needed). */
#aside:empty{display:none}
.glance{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;margin:0 0 14px}
.glance h2{font:700 1rem/1.2 var(--f-display);margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.glance h2 button{font:inherit;font-size:.8rem;font-weight:400;color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi b{display:block;font:700 1.7rem/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--fg)}
.kpi span{display:block;margin-top:4px;font-size:.76rem;line-height:1.2;color:var(--muted)}
.toplist{display:grid;gap:2px}
.toplist .lbl{font-size:.76rem;color:var(--muted);margin:0 0 4px;text-transform:uppercase;letter-spacing:.05em}
.tbar{display:grid;grid-template-columns:minmax(0,8.5rem) 1fr 1.8rem;gap:10px;align-items:center;width:100%;border:0;background:none;padding:6px 4px;border-radius:6px;text-align:left;cursor:pointer;font-size:.86rem;color:var(--fg)}
.tbar:hover{background:var(--sunk)}
.tbar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar .tr{display:block;height:10px}
.tbar .fl{display:block;height:100%;min-width:4px;background:var(--leaf);border-radius:0 4px 4px 0}
.tbar .v{font:500 .8rem var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.chip .ct{font:500 .74rem var(--f-mono);opacity:.65;margin-left:5px}

/* Inquiry list: + buttons, floating bar, list sheet */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto}
.row:not(.solo) .item{border-radius:12px 0 0 12px}
.add{width:52px;border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0;background:var(--surface);color:var(--leaf);font:700 1.35rem/1 var(--f-body);cursor:pointer;display:grid;place-items:center}
.add:hover{background:var(--leaf-soft)}
.add[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.listbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:12px;width:min(440px,calc(100% - 32px));background:var(--fg);color:var(--bg);border-radius:999px;padding:7px 7px 7px 18px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.listbar span{flex:1;font-weight:700;font-size:.9rem;line-height:1.2}
.listbar .btn{padding:10px 16px;border-radius:999px;white-space:nowrap}
body.has-list main .wrap{padding-bottom:110px}
body:has(.scrim:not([hidden])) .listbar{display:none}
.sheet .lead{margin:6px 0 4px;font-size:.88rem;color:var(--muted)}
.sheet h4{font:700 .95rem/1.2 var(--f-display);margin:18px 0 6px}
.li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li img{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block;background:var(--sunk)}
.li .sw{justify-self:center}
.li .t{font-weight:700;line-height:1.25}
.li .m{font-size:.8rem;color:var(--muted)}
.li .warn{font-size:.78rem;color:var(--hold);margin-top:2px}
.li .x{border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:8px}
.qty{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:.82rem}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-size:1rem;line-height:1}
.field{display:grid;gap:4px;margin-top:10px;font-size:.84rem;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.field textarea{min-height:64px;resize:vertical}
.field textarea.preview{min-height:150px;font-size:.88rem}
.channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.channels button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:11px 8px;font-weight:700;cursor:pointer}
.channels button[aria-pressed="true"]{border:2px solid var(--accent);color:var(--accent);padding:10px 7px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.84rem;padding:6px 0;justify-self:center}

.sheet form.inq{display:block}
.picked{margin:6px 0 2px;padding:4px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.picked:empty{display:none}
.picked .lead{margin:8px 0}
.pickedlbl{margin:8px 0 0;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.contacts{display:grid;gap:8px}
.copt{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:2px 12px}
.copt.on{border-color:var(--leaf);box-shadow:inset 3px 0 0 var(--leaf)}
.ctoggle{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:700;cursor:pointer}
.ctoggle input{width:20px;height:20px;accent-color:var(--leaf);flex:none}
.copt > input{width:100%;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.field.big .q{font:700 .98rem/1.3 var(--f-display);color:var(--fg)}
.field.big textarea{min-height:110px}
.trap{position:absolute!important;left:-10000px!important;width:1px;height:1px;opacity:0}
.formerr{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--hold-soft);color:var(--hold);font-size:.88rem}
.inq > .btn{width:100%;margin-top:14px}
.lead.small{font-size:.8rem;text-align:center;margin-top:8px}
.fallback{display:grid;gap:8px;margin-top:8px}
.fallback textarea{min-height:120px;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:.86rem}
.sent{text-align:center;padding:18px 4px 6px;display:grid;gap:10px;justify-items:center}
.sent .tick{width:56px;height:56px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center;font-size:1.6rem;font-weight:700}
.sent h3{margin:0}
.sentlist{list-style:none;margin:4px 0 6px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;text-align:left;font-size:.86rem;width:100%}
.sentlist li{padding:3px 0}
.sent .btn{width:100%}

/* Desktop: same page, wider layout. Phones keep the layout above. */
@media (min-width:1024px){
  .wrap{max-width:1260px;padding-left:32px;padding-right:32px}
  header.top .wrap{grid-template-columns:auto minmax(300px,380px) minmax(0,1fr);align-items:center;column-gap:28px;padding-block:16px 12px}
  .brand{flex-direction:column;align-items:flex-start;gap:4px;flex-wrap:nowrap}
  h1{font-size:1.9rem}
  .search{max-width:560px;justify-self:end;width:100%}
  .chips{grid-column:1/-1;flex-wrap:wrap;overflow:visible}
  .shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:start;padding-top:22px}
  #aside{position:sticky;top:calc(var(--hdr,150px) + 18px);max-height:calc(100vh - var(--hdr,150px) - 36px);overflow:auto}
  #aside .glance{padding:18px 18px 12px}
  .group{margin-top:22px}
  .group:first-of-type{margin-top:6px}
  .list{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .thumb{width:64px;height:64px}
  .item.has-photo{grid-template-columns:64px 1fr auto}
  .stat-row{max-width:720px}
  .bars{max-width:720px}
  .scrim{align-items:center;padding:32px}
  .sheet{border-radius:18px;max-width:600px;max-height:calc(100vh - 64px);padding:24px 28px 26px}
  .sheet .grab{display:none}
  .sheet.has-gallery{max-width:1040px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:30px;align-content:start}
  .sheet.has-gallery > *{grid-column:2}
  .sheet.has-gallery > .gallery{grid-column:1;grid-row:1 / span 30;margin:0;border-radius:14px;overflow:hidden;align-self:start;position:sticky;top:0}
  .slide{max-height:calc(100vh - 120px)}
  .listbar{left:auto;right:32px;transform:none;width:400px}
  body.has-list main .wrap{padding-bottom:40px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Plant Catalog</h1>
      <small id="updated">Rare aroids and corms</small>
    </div>
    <div class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-plants" aria-selected="true" data-tab="plants">Plants<span class="n" id="n-plants"></span></button>
      <button role="tab" id="tab-corms" aria-selected="false" data-tab="corms">Corms<span class="n" id="n-corms"></span></button>
      <button role="tab" id="tab-counts" aria-selected="false" data-tab="counts">Counts</button>
    </div>
    <div class="search" id="searchrow">
      <input id="q" type="search" placeholder="Search cultivar, var-type, SKU" autocomplete="off" enterkeyhint="search" aria-label="Search">
      <label class="toggle"><input id="avail" type="checkbox" checked> Available</label>
    </div>
    <div class="chips" id="chips" aria-label="Filter by stage"></div>
  </div>
</header>

<main>
  <div class="wrap shell">
    <aside id="aside" aria-label="What's available"></aside>
    <div id="view"><p class="summary">Loading the catalog…</p></div>
  </div>
</main>

<div class="scrim" id="scrim" hidden></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const state = {tab:'plants', q:'', avail:true, stage:'', data:null};
  try{ const t = localStorage.getItem('pc.tab'); if(['plants','corms','counts'].includes(t)) state.tab = t; }catch(e){}
  const h = location.hash.replace('#','');
  if(['plants','corms','counts'].includes(h)) state.tab = h;

  const STATUS = {available:'Available', hold:'On hold', nfs:'Not for sale'};
  const STAGE_ORDER = ['Sprouting Corm','Lil Babyy','Pup','Offshoot','Teen','Parent','Cutting','Rehab'];

  function swatch(v){
    const s = (v||'').toLowerCase();
    let c = null, speck = false;
    if(/dappled|splash|starburst|spotted|mystery/.test(s)) speck = true;
    else if(/pink|magenta|strawberry/.test(s)) c = 'var(--sw-pink)';
    else if(/purple|mauve|cobra/.test(s)) c = 'var(--sw-purple)';
    else if(/mint/.test(s)) c = 'var(--sw-mint)';
    else if(/aurea|lemon|neon|sunset|orange|lava|mist/.test(s)) c = 'var(--sw-aurea)';
    else if(/albo|variegated|platinum/.test(s)) c = 'var(--sw-albo)';
    const el = document.createElement('span');
    el.className = 'sw' + (speck ? ' speck' : '');
    if(c) el.style.setProperty('--v', c);
    el.setAttribute('aria-hidden','true');
    return el;
  }
  function pill(st){ const p=document.createElement('span'); p.className='pill '+st; p.textContent=STATUS[st]; return p; }
  function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function matches(hay, q){ return q.split(/\s+/).filter(Boolean).every(w => hay.includes(w)); }

  // Drive-hosted media: files are shared "anyone with the link" by the uploader script.
  const img1 = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
  const img2 = (id, w) => `https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=w${w}`;
  function driveImg(id, w, alt, eager){
    const i = el('img'); i.alt = alt || ''; i.decoding = 'async'; i.loading = eager ? 'eager' : 'lazy';
    i.referrerPolicy = 'no-referrer';
    i.src = img1(id, w);
    i.onerror = () => { if(!i.dataset.alt){ i.dataset.alt = '1'; i.src = img2(id, w); } else i.dispatchEvent(new CustomEvent('gone')); };
    return i;
  }
  const cover = media => media.find(m => m.k==='photo') || media[0];

  function fmtTime(iso){
    const d = new Date(iso); if(isNaN(d)) return '';
    const sameDay = d.toDateString() === new Date().toDateString();
    return sameDay ? d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})
                   : d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }

  const mqWide = matchMedia('(min-width:1024px)');

  function render(){
    const d = state.data; if(!d) return;
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab===state.tab)));
    $('#searchrow').hidden = state.tab==='counts';
    $('#chips').hidden = state.tab!=='plants';
    const view = $('#view'); view.replaceChildren();
    if(state.tab==='plants') renderPlants(view);
    else if(state.tab==='corms') renderCorms(view);
    else renderCounts(view);
    $('#aside').replaceChildren(...(mqWide.matches ? [glance()] : []));
    measureHeader();
  }
  function setTab(t){
    state.tab = t; try{ localStorage.setItem('pc.tab', t); }catch(e){}
    window.scrollTo(0,0); render();
  }
  function measureHeader(){ document.documentElement.style.setProperty('--hdr', $('header.top').offsetHeight + 'px'); }

  function renderChips(){
    const pool = state.data.plants.filter(p => !state.avail || p.status==='available');
    const counts = new Map(); pool.forEach(p => { if(p.stage) counts.set(p.stage, (counts.get(p.stage)||0)+1); });
    const stages = [...counts.keys()].sort((a,b)=>(STAGE_ORDER.indexOf(a)+99)%99-(STAGE_ORDER.indexOf(b)+99)%99);
    if(state.stage && !counts.has(state.stage)) stages.push(state.stage);
    const box = $('#chips'); box.replaceChildren();
    ['All stages',...stages].forEach(s => {
      const val = s==='All stages' ? '' : s;
      const b = el('button','chip', s); b.type='button';
      b.append(el('span','ct', String(val ? (counts.get(val)||0) : pool.length)));
      b.setAttribute('aria-pressed', String(state.stage===val));
      b.onclick = () => { state.stage = val; renderChips(); render(); };
      box.append(b);
    });
  }

  // ---- At a glance ----
  function glance(){
    const d = state.data;
    const P = d.plants.filter(p=>p.status==='available'), C = d.corms.filter(c=>c.status==='available');
    const g = el('section','glance');
    const h = el('h2', null, 'Available right now');
    const more = el('button', null, 'All counts →'); more.type='button'; more.onclick = () => setTab('counts');
    h.append(more); g.append(h);
    const k = el('div','kpis');
    [[P.length,'plants'],[C.reduce((s,c)=>s+c.qty,0),'corms'],[new Set(P.map(p=>p.cultivar)).size,'cultivars']]
      .forEach(([n,l]) => { const x=el('div','kpi'); x.append(el('b',null,String(n)), el('span',null,l)); k.append(x); });
    g.append(k);
    const rows = tally(P, p=>p.cultivar).slice(0,6);
    if(rows.length){
      const box = el('div','toplist'); box.append(el('p','lbl','Most available'));
      const max = rows[0][1];
      rows.forEach(([name, n]) => {
        const b = el('button','tbar'); b.type='button'; b.title = `${name}: ${n} available. Show them.`;
        b.setAttribute('aria-label', `${name}, ${n} available. Show them.`);
        const tr = el('span','tr'); const f = el('span','fl'); f.style.width = (n/max*100).toFixed(1)+'%'; tr.append(f);
        b.append(el('span','l',name), tr, el('span','v',String(n)));
        b.onclick = () => {
          state.q = name; $('#q').value = name; state.stage = ''; state.avail = true; $('#avail').checked = true;
          renderChips(); setTab('plants');
        };
        box.append(b);
      });
      g.append(box);
    }
    return g;
  }

  // ---- Inquiry list (kept on this device only) ----
  let list = [];
  try{ list = (JSON.parse(localStorage.getItem('pc.list') || '[]') || []).filter(i => i && typeof i.k === 'string'); }catch(e){ list = []; }
  const keyOf = (kind, x) => kind==='plant' ? 'p:'+x.sku : 'c:'+x.lot;
  const inList = k => list.some(i => i.k === k);
  const canAdd = x => x.status==='available' || x.status==='hold';
  function saveList(){ try{ localStorage.setItem('pc.list', JSON.stringify(list)); }catch(e){} updateListBar(); }
  function toggleItem(kind, x){
    const k = keyOf(kind, x);
    if(inList(k)) list = list.filter(i => i.k !== k); else list.push({k, qty:1});
    saveList(); render();
  }
  function resolve(i){
    const d = state.data; if(!d) return null;
    const id = i.k.slice(2);
    if(i.k[0]==='p'){ const p = d.plants.find(p=>p.sku===id); return p ? {kind:'plant', x:p} : null; }
    const c = d.corms.find(c=>c.lot===id); return c ? {kind:'corm', x:c} : null;
  }
  function addBtn(kind, x){
    const k = keyOf(kind, x), on = inList(k);
    const name = kind==='plant' ? `${x.cultivar} ${x.var}, SKU ${x.sku}` : `${x.item}, lot ${x.lot}`;
    const b = el('button','add', on ? '✓' : '+'); b.type='button';
    b.setAttribute('aria-pressed', String(on));
    b.setAttribute('aria-label', on ? `Remove ${name} from your inquiry list` : `Add ${name} to your inquiry list`);
    b.title = on ? 'In your inquiry list (tap to remove)' : 'Add to inquiry list';
    b.onclick = () => toggleItem(kind, x);
    return b;
  }
  function row(btn, kind, x){
    const w = el('div','row'); w.append(btn);
    if(canAdd(x)) w.append(addBtn(kind, x)); else w.classList.add('solo');
    return w;
  }

  function renderPlants(view){
    const q = state.q.toLowerCase().trim();
    let list = state.data.plants.filter(p =>
      (!state.avail || p.status==='available') &&
      (!state.stage || p.stage===state.stage) &&
      (!q || matches([p.sku,p.cultivar,p.var,p.species,p.stage,STATUS[p.status]].join(' ').toLowerCase(), q)));
    const rank = {available:0, hold:1, nfs:2};
    list.sort((a,b)=> a.cultivar.localeCompare(b.cultivar) || a.var.localeCompare(b.var) || rank[a.status]-rank[b.status] || a.sku.localeCompare(b.sku));
    if(!mqWide.matches && !q && !state.stage) view.append(glance());
    view.append(el('p','summary', `${list.length} plant${list.length===1?'':'s'}` + (state.avail?' available':' in the collection') + (state.stage?` \u00b7 ${state.stage}`:'') + (q?` matching \u201c${state.q.trim()}\u201d`:'')));
    if(!list.length){ view.append(emptyState()); return; }
    const groups = new Map();
    list.forEach(p => { if(!groups.has(p.cultivar)) groups.set(p.cultivar, []); groups.get(p.cultivar).push(p); });
    groups.forEach((items, name) => {
      const g = el('section','group');
      const h2 = el('h2', null, name); h2.append(el('span','c', String(items.length)));
      const ul = el('div','list');
      items.forEach(p => {
        const b = el('button','item'); b.type='button';
        const mid = el('div','mid');
        mid.append(el('div','t', p.var || 'Var-type not listed'), el('div','m', [p.stage, p.species && p.species!==p.cultivar ? p.species : ''].filter(Boolean).join(' \u00b7 ') || ' '));
        const r = el('div','r'); r.append(el('span','sku','SKU '+p.sku), pill(p.status));
        if(p.media && p.media.length){
          const img = driveImg(cover(p.media).id, 160, ''); img.className = 'thumb';
          img.addEventListener('gone', () => { img.replaceWith(swatch(p.var)); b.classList.remove('has-photo'); });
          b.classList.add('has-photo');
          const nP = p.media.filter(m=>m.k==='photo').length, nV = p.media.length - nP;
          mid.append(el('span','cam', [nP ? nP+(nP===1?' photo':' photos') : '', nV ? nV+(nV===1?' video':' videos') : ''].filter(Boolean).join(' · ')));
          b.append(img, mid, r);
        } else b.append(swatch(p.var), mid, r);
        b.onclick = () => openSheet('plant', p);
        ul.append(row(b, 'plant', p));
      });
      g.append(h2, ul); view.append(g);
    });
  }

  function renderCorms(view){
    const q = state.q.toLowerCase().trim();
    let list = state.data.corms.filter(c =>
      (!state.avail || c.status==='available') &&
      (!q || matches([c.lot,c.item,c.var,c.cultivar,'corm',STATUS[c.status]].join(' ').toLowerCase(), q)));
    list.sort((a,b)=> a.item.localeCompare(b.item) || a.lot.localeCompare(b.lot));
    const total = list.filter(c=>c.status==='available').reduce((s,c)=>s+c.qty,0);
    view.append(el('p','summary', `${list.length} lot${list.length===1?'':'s'}` + (state.avail?` \u00b7 ${total} corms available`:' in the collection') + (q?` matching \u201c${state.q.trim()}\u201d`:'')));
    if(!list.length){ view.append(emptyState()); return; }
    const ul = el('div','list');
    list.forEach(c => {
      const b = el('button','item'); b.type='button';
      const mid = el('div','mid');
      mid.append(el('div','t', c.item), el('div','m', [c.qty ? `${c.qty} corm${c.qty===1?'':'s'}` : '', c.var, c.harvest ? 'Harvested '+c.harvest : ''].filter(Boolean).join(' \u00b7 ')));
      const r = el('div','r'); r.append(el('span','sku','Lot '+c.lot), pill(c.status));
      b.append(swatch(c.var || c.item), mid, r);
      b.onclick = () => openSheet('corm', c);
      ul.append(row(b, 'corm', c));
    });
    view.append(ul);
  }

  function emptyState(){
    const e = el('div','empty');
    e.append(el('div', null, 'Nothing matches that search.'));
    if(state.avail){ const b=el('button','chip','Include items not for sale'); b.type='button'; b.style.marginTop='10px'; b.onclick=()=>{state.avail=false; $('#avail').checked=false; render();}; e.append(b); }
    return e;
  }

  function bars(rows, cls){
    const box = el('div','bars'); const max = Math.max(1,...rows.map(r=>r[1]));
    rows.forEach(([label, v]) => {
      const row = el('div','bar'+(cls?' '+cls:''));
      const l = el('span','l',label); l.title = label;
      const t = el('span','track'); const f = el('span','fill'); f.style.width = (v/max*100).toFixed(1)+'%'; t.append(f);
      row.append(l, t, el('span','v', String(v)));
      box.append(row);
    });
    return box;
  }
  function tally(arr, key, w){ const m=new Map(); arr.forEach(x=>{const k=key(x); if(k) m.set(k,(m.get(k)||0)+(w?w(x):1));}); return [...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }

  function renderCounts(view){
    const P = state.data.plants, C = state.data.corms;
    const avail = P.filter(p=>p.status==='available');
    const cAvail = C.filter(c=>c.status==='available');
    const stats = el('div','stat-row');
    [[avail.length,'plants available'],[cAvail.reduce((s,c)=>s+c.qty,0),'corms available'],[new Set(avail.map(p=>p.cultivar)).size,'cultivars for sale']]
      .forEach(([n,l])=>{ const s=el('div','stat'); s.append(el('b',null,String(n)), el('span',null,l)); stats.append(s); });
    view.append(stats);
    const sec = (title, node, note) => { const g=el('section','group'); const h=el('h2',null,title); g.append(h,node); if(note) g.append(el('p','note',note)); view.append(g); };
    sec('Available plants by cultivar', bars(tally(avail, p=>p.cultivar).slice(0,12)), 'Top 12 cultivars by plants available now.');
    sec('Available plants by stage', bars(tally(avail, p=>p.stage||'Stage not listed').sort((a,b)=>(STAGE_ORDER.indexOf(a[0])+99)%99-(STAGE_ORDER.indexOf(b[0])+99)%99)));
    sec('Available corms by cultivar', bars(tally(cAvail, c=>c.cultivar||c.item, c=>c.qty).slice(0,12), 'corm'), 'Counts are individual corms across all lots.');
    sec('Whole collection by species', bars(tally(P, p=>p.species||null).slice(0,10)), 'Plants with a species recorded, including those not for sale.');
  }

  function gallery(media, alt){
    const g = el('div','gallery'); const strip = el('div','strip');
    strip.setAttribute('aria-label','Photos and videos');
    media.forEach((m, i) => {
      const s = el('div','slide');
      if(m.k==='photo'){
        const im = driveImg(m.id, 1600, `${alt}, photo ${i+1}`, i<2);
        im.addEventListener('gone', () => im.replaceWith(el('span','note','This photo couldn’t load right now.')));
        s.append(im);
      }
      else {
        // Video: show its poster with a play button; load Drive's player only when tapped.
        const b = el('button','vid'); b.type='button'; b.setAttribute('aria-label',`Play video of ${alt}`);
        b.append(driveImg(m.id, 1000, '', i<2), el('span','play'));
        b.onclick = () => {
          const f = el('iframe'); f.src = `https://drive.google.com/file/d/${encodeURIComponent(m.id)}/preview`;
          f.allow = 'autoplay; fullscreen'; f.allowFullscreen = true; f.title = `Video of ${alt}`;
          b.replaceWith(f);
        };
        s.append(b);
      }
      strip.append(s);
    });
    const count = el('span','count', `1 / ${media.length}`);
    strip.addEventListener('scroll', () => {
      const i = Math.round(strip.scrollLeft / Math.max(1, strip.clientWidth));
      count.textContent = `${Math.min(media.length, i+1)} / ${media.length}`;
    }, {passive:true});
    g.append(strip);
    if(media.length > 1){
      g.append(count);
      const prev = el('button','gnav prev','\u2039'); prev.type='button'; prev.setAttribute('aria-label','Previous photo');
      const next = el('button','gnav next','\u203a'); next.type='button'; next.setAttribute('aria-label','Next photo');
      prev.onclick = () => strip.scrollBy({left:-strip.clientWidth, behavior:'smooth'});
      next.onclick = () => strip.scrollBy({left:strip.clientWidth, behavior:'smooth'});
      g.append(prev, next);
    }
    return g;
  }

  // ---- Detail sheet ----
  const scrim = $('#scrim'); let lastFocus = null;
  function closeSheet(){ scrim.hidden = true; scrim.replaceChildren(); if(lastFocus) lastFocus.focus(); }
  scrim.addEventListener('click', e => { if(e.target===scrim) closeSheet(); });
  document.addEventListener('keydown', e => { if(e.key==='Escape' && !scrim.hidden) closeSheet(); });

  function openSheet(kind, x){
    lastFocus = document.activeElement;
    const s = el('div','sheet'); s.setAttribute('role','dialog'); s.setAttribute('aria-modal','true');
    s.append(el('div','grab'));
    if(x.media && x.media.length){ s.classList.add('has-gallery'); s.append(gallery(x.media, kind==='plant' ? x.cultivar+' '+x.var : x.item)); }
    const head = el('div','head');
    const title = kind==='plant' ? x.cultivar : x.item;
    const ht = el('div'); ht.append(el('h3',null,title), el('div','sku', (kind==='plant'?'SKU ':'Lot ')+(kind==='plant'?x.sku:x.lot)));
    head.append(swatch(x.var || title), ht);
    s.append(head);
    const dl = el('dl','label');
    const rows = kind==='plant'
      ? [['Status',STATUS[x.status]],['Var-type',x.var],['Stage',x.stage],['Species',x.species]]
      : [['Status',STATUS[x.status]],['Quantity',x.qty?`${x.qty} corm${x.qty===1?'':'s'}`:''],['Var-type',x.var],['Cultivar',x.cultivar],['Harvested',x.harvest]];
    rows.filter(r=>r[1]).forEach(([k,v])=>{ const d=el('div'); d.append(el('dt',null,k), el('dd',null,v)); dl.append(d); });
    s.append(dl);

    const actions = el('div','actions');
    if(canAdd(x)){
      const k = keyOf(kind, x);
      const add = el('button','btn'); add.type='button';
      const paint = () => { const on = inList(k); add.textContent = on ? '✓ In your inquiry list' : 'Add to inquiry list'; add.classList.toggle('ghost', on); };
      add.onclick = () => { toggleItem(kind, x); paint(); };
      paint(); actions.append(add);
    }
    if(x.album){ const a=el('a','btn ghost','View photos'); a.href=x.album; a.target='_blank'; a.rel='noopener'; actions.append(a); }
    const askBtn = el('button','btn ghost','Ask about just this '+(kind==='plant'?'plant':'lot')); askBtn.type='button';
    actions.append(askBtn);
    s.append(actions);

    askBtn.onclick = () => openList([{k: keyOf(kind, x), qty: 1}]);

    const close = el('button','btn ghost','Close'); close.type='button'; close.style.marginTop='10px'; close.style.width='100%'; close.onclick = closeSheet;
    s.append(close);
    scrim.replaceChildren(s); scrim.hidden = false; close.focus();
  }

  // ---- Inquiry list: floating bar + sheet ----
  const bar = el('div','listbar'); bar.hidden = true; bar.setAttribute('role','region'); bar.setAttribute('aria-label','Inquiry list');
  document.body.append(bar);
  function updateListBar(){
    const n = list.length;
    bar.hidden = !n; document.body.classList.toggle('has-list', !!n);
    if(!n) return;
    const b = el('button','btn','Ready to inquire'); b.type='button'; b.onclick = openList;
    bar.replaceChildren(el('span', null, `Inquiry list · ${n}`), b);
  }

  function copyText(text, ta){
    try{ if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(()=>true, ()=>fallbackCopy(ta)); }catch(e){}
    return Promise.resolve(fallbackCopy(ta));
  }
  function fallbackCopy(ta){ try{ ta.focus(); ta.select(); return document.execCommand('copy'); }catch(e){ return false; } }

  const CONTACTS = [
    {id:'facebook',  label:'Facebook / Messenger', ph:'Your Facebook name or profile link', type:'text', ac:'off'},
    {id:'instagram', label:'Instagram',            ph:'@yourhandle',                        type:'text', ac:'off'},
    {id:'email',     label:'Email',                ph:'you@example.com',                    type:'email', ac:'email'},
    {id:'other',     label:'Other',                ph:'Text, Discord, Palmstreet… tell me how', type:'text', ac:'off'},
  ];

  // Inquiry lines: "[0011] - Chantrieri Pink"; corm lots are marked so they don't clash with plant numbers.
  function itemLine(i){
    const r = resolve(i);
    if(!r) return `[${i.k[0]==='p' ? '' : 'Corm '}${i.k.slice(2)}]`;
    const {kind, x} = r;
    return kind==='plant'
      ? `[${x.sku}] - ${x.cultivar}${x.var?' '+x.var:''}`
      : `[Corm ${x.lot}] - ${x.item}${x.qty>1 ? ` × ${Math.min(i.qty||1, x.qty)}` : ''}`;
  }

  // items: the shared inquiry list, or a one-off list from "Ask about just this plant".
  function openList(oneOff){
    lastFocus = document.activeElement;
    const single = Array.isArray(oneOff);
    let picks = single ? oneOff : list;
    let saved = {}; try{ saved = JSON.parse(localStorage.getItem('pc.inq2') || '{}') || {}; }catch(e){}
    const on = saved.on || {}, vals = saved.vals || {};

    const s = el('div','sheet'); s.setAttribute('role','dialog'); s.setAttribute('aria-modal','true'); s.setAttribute('aria-labelledby','inq-title');
    const title = el('h3', null, single ? 'Ask about this one' : 'Ready to inquire'); title.id = 'inq-title';
    s.append(el('div','grab'), title);

    const form = el('form','inq'); form.noValidate = true; s.append(form);

    // What they picked
    const items = el('div','picked'); form.append(items);

    // 1. Contact
    const cHead = el('h4', null, 'What’s the best way to contact you?');
    const cSub = el('p','lead','Choose one or more, and I’ll reach out there.');
    const cBox = el('div','contacts');
    const inputs = {};
    CONTACTS.forEach(c => {
      const wrap = el('div','copt');
      const lab = el('label','ctoggle');
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!on[c.id];
      lab.append(cb, el('span', null, c.label));
      const inp = el('input'); inp.type = c.type; inp.placeholder = c.ph; inp.autocomplete = c.ac; inp.value = vals[c.id] || '';
      inp.setAttribute('aria-label', c.label); inp.hidden = !cb.checked;
      if(c.id==='email'){ inp.inputMode = 'email'; inp.autocapitalize = 'off'; }
      if(c.id==='instagram'){ inp.autocapitalize = 'off'; inp.spellcheck = false; }
      cb.addEventListener('change', () => { inp.hidden = !cb.checked; wrap.classList.toggle('on', cb.checked); if(cb.checked) inp.focus(); persist(); validate(false); });
      inp.addEventListener('input', () => { persist(); validate(false); });
      wrap.classList.toggle('on', cb.checked);
      wrap.append(lab, inp); cBox.append(wrap);
      inputs[c.id] = {cb, inp};
    });
    form.append(cHead, cSub, cBox);

    // 2. Name + inquiry
    const nameF = el('label','field'); nameF.append('Your name (optional)');
    const name = el('input'); name.autocomplete = 'name'; name.value = saved.name || ''; nameF.append(name);
    const msgF = el('label','field big'); msgF.append(el('span','q','Tell me what you’d like to know! 🌱'));
    const msg = el('textarea');
    msg.placeholder = 'Ask anything: price, size, photos of the actual plant, shipping to your area, bundle deals…';
    msg.value = saved.msg || ''; msgF.append(msg);
    // hidden spam trap: people never see or fill this
    const trap = el('input'); trap.name = 'website'; trap.tabIndex = -1; trap.autocomplete = 'off';
    trap.setAttribute('aria-hidden','true'); trap.className = 'trap';
    form.append(nameF, msgF, trap);

    const err = el('p','formerr'); err.setAttribute('role','alert'); err.hidden = true;
    const send = el('button','btn','Send inquiry'); send.type = 'submit';
    const note = el('p','lead small','No commitment, just a conversation. Your details only go to me.');
    form.append(err, send, note);
    const clear = el('button','linkbtn','Clear my list'); clear.type='button'; clear.hidden = single;
    const close = el('button','btn ghost','Keep browsing'); close.type='button'; close.style.marginTop='10px'; close.style.width='100%'; close.onclick = closeSheet;
    s.append(close, clear);

    function persist(){
      const o = {}, v = {};
      CONTACTS.forEach(c => { o[c.id] = inputs[c.id].cb.checked; v[c.id] = inputs[c.id].inp.value; });
      try{ localStorage.setItem('pc.inq2', JSON.stringify({on:o, vals:v, name:name.value, msg:msg.value})); }catch(e){}
    }
    [name, msg].forEach(f => f.addEventListener('input', persist));

    function contact(){
      const out = {};
      CONTACTS.forEach(c => { if(inputs[c.id].cb.checked && inputs[c.id].inp.value.trim()) out[c.id] = inputs[c.id].inp.value.trim(); });
      return out;
    }
    function validate(show){
      const c = contact(); let m = '';
      if(!Object.keys(c).length) m = 'Pick at least one way to reach you and fill it in.';
      else if(c.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email)) m = 'That email address doesn’t look quite right.';
      else if(!picks.length && !msg.value.trim()) m = 'Add a plant to your list or tell me what you’re looking for.';
      if(show || !err.hidden){ err.textContent = m; err.hidden = !m; }
      return !m;
    }
    function textVersion(){
      const c = contact();
      return ['Hi! I’m interested in these from your Plant Catalog:', ...picks.map(i => '• ' + itemLine(i)), '',
        msg.value.trim() || 'Could you let me know availability, pricing and shipping?',
        name.value.trim() ? '\n— ' + name.value.trim() : '',
        Object.keys(c).length ? '\nReach me at: ' + Object.entries(c).map(([k,v]) => `${CONTACTS.find(x=>x.id===k).label}: ${v}`).join(', ') : ''
      ].filter(Boolean).join('\n');
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      if(!validate(true)) return;
      const CFGx = window.CATALOG_CONFIG || {};
      const payload = {name: name.value.trim(), contact: contact(), items: picks.map(itemLine), message: msg.value.trim(), website: trap.value, page: 'catalog'};
      send.disabled = true; send.textContent = 'Sending…';
      fetch(CFGx.FEED_URL, {method:'POST', body: JSON.stringify(payload)})
        .then(r => r.json())
        .then(res => {
          if(!res || !res.ok) throw new Error(res && res.error || 'failed');
          done(payload);
        })
        .catch(errx => {
          send.disabled = false; send.textContent = 'Try again';
          err.hidden = false;
          err.textContent = String(errx.message) === 'busy'
            ? 'Lots of inquiries right now. Please try again in a minute.'
            : 'That didn’t go through. Try again, or copy your inquiry and message me directly:';
          if(String(errx.message) !== 'busy' && !form.querySelector('.fallback')){
            const fb = el('div','fallback');
            const ta = el('textarea'); ta.value = textVersion(); ta.readOnly = true; ta.setAttribute('aria-label','Your inquiry as text');
            const cp = el('button','btn ghost','Copy my inquiry'); cp.type='button';
            cp.onclick = () => copyText(ta.value, ta).then(ok => { cp.textContent = ok ? 'Copied' : 'Selected: copy it'; });
            fb.append(ta, cp);
            const ct = (CFGx.contact || {});
            if(ct.url){ const a = el('a','btn ghost', ct.label || 'Message me'); a.href = ct.url; a.target='_blank'; a.rel='noopener'; fb.append(a); }
            err.after(fb);
          }
        });
    });

    function done(p){
      if(!single){ list = []; saveList(); render(); }
      msg.value = ''; persist();
      const ways = Object.keys(p.contact).map(k => CONTACTS.find(x=>x.id===k).label).join(' or ');
      s.replaceChildren(el('div','grab'));
      const ok = el('div','sent');
      ok.append(el('div','tick','✓'), el('h3', null, 'Inquiry sent!'),
        el('p','lead', `Thanks${p.name ? ', ' + p.name : ''}! I’ll get back to you on ${ways} soon.`));
      if(p.items.length){ const ul = el('ul','sentlist'); p.items.forEach(t => ul.append(el('li', null, t))); ok.append(ul); }
      const back = el('button','btn','Back to the catalog'); back.type='button'; back.onclick = closeSheet;
      ok.append(back); s.append(ok); back.focus();
    }

    function drawItems(){
      items.replaceChildren();
      clear.hidden = single || !picks.length;
      if(!picks.length){ items.append(el('p','lead', single ? '' : 'Your list is empty, but you can still ask about anything below.')); return; }
      items.append(el('p','pickedlbl', `${picks.length} item${picks.length===1?'':'s'}`));
      picks.forEach(i => {
        const r = resolve(i); const li = el('div','li');
        const x0 = el('button','x','×'); x0.type='button';
        x0.onclick = () => {
          if(single){ picks = picks.filter(j => j !== i); }
          else { list = list.filter(j => j !== i); picks = list; saveList(); render(); }
          drawItems(); validate(false);
        };
        if(!r){
          x0.setAttribute('aria-label','Remove');
          const m = el('div'); m.append(el('div','t', (i.k[0]==='p'?'SKU ':'Lot ') + i.k.slice(2)), el('div','warn','No longer listed'));
          li.append(el('span'), m, x0); items.append(li); return;
        }
        const {kind, x} = r;
        const nm = kind==='plant' ? `${x.cultivar}${x.var?' '+x.var:''}` : x.item;
        x0.setAttribute('aria-label', `Remove ${nm}`);
        let pic;
        if(kind==='plant' && x.media && x.media.length){ pic = driveImg(cover(x.media).id, 120, ''); pic.addEventListener('gone', () => pic.replaceWith(swatch(x.var))); }
        else pic = swatch(x.var || x.item);
        const m = el('div');
        m.append(el('div','t', nm), el('div','m', kind==='plant' ? `SKU ${x.sku}${x.stage?' · '+x.stage:''}` : `Lot ${x.lot}${x.var?' · '+x.var:''}`));
        if(x.status==='hold') m.append(el('div','warn','On hold right now, but you can still ask'));
        else if(x.status!=='available') m.append(el('div','warn','No longer for sale'));
        if(kind==='corm' && x.qty>1){
          const q = el('div','qty'); const minus = el('button', null, '−'), plus = el('button', null, '+'), val = el('span');
          minus.type = plus.type = 'button'; minus.setAttribute('aria-label','Fewer corms'); plus.setAttribute('aria-label','More corms');
          const upd = () => { i.qty = Math.min(Math.max(1, i.qty||1), x.qty); val.textContent = `${i.qty} of ${x.qty} corms`; minus.disabled = i.qty<=1; plus.disabled = i.qty>=x.qty; };
          minus.onclick = () => { i.qty--; upd(); if(!single) saveList(); };
          plus.onclick = () => { i.qty++; upd(); if(!single) saveList(); };
          upd(); q.append(minus, val, plus); m.append(q);
        }
        li.append(pic, m, x0); items.append(li);
      });
    }
    clear.onclick = () => { list = []; picks = list; saveList(); render(); drawItems(); };
    drawItems();
    scrim.replaceChildren(s); scrim.hidden = false;
    const firstOn = CONTACTS.find(c => inputs[c.id].cb.checked);
    (firstOn ? inputs[firstOn.id].inp : inputs.facebook.cb).focus();
  }

  // ---- Wiring ----
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  mqWide.addEventListener('change', () => render());
  window.addEventListener('resize', measureHeader);
  updateListBar();
  $('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
  $('#avail').addEventListener('change', e => { state.avail = e.target.checked; renderChips(); render(); });

  // ---- Live data ----
  // Each visitor's copy runs on its own: it reads the feed, keeps the last copy on this
  // device for instant start-up, and checks again whenever the app comes back on screen.
  const CFG = window.CATALOG_CONFIG || {};
  const CACHE_KEY = 'pc.catalog.v1';
  let lastFetch = 0, loading = false;

  function apply(d, fromCache){
    if(!d || !Array.isArray(d.plants) || !Array.isArray(d.corms)) return false;
    const first = !state.data;
    state.data = d;
    const u = $('#updated'); u.replaceChildren();
    const live = el('span', 'live' + (fromCache ? ' stale' : ''), fromCache ? 'Updating…' : 'Live · updated ' + fmtTime(d.updated));
    u.append(live);
    $('#n-plants').textContent = d.plants.filter(p=>p.status==='available').length;
    $('#n-corms').textContent = d.corms.filter(c=>c.status==='available').reduce((s,c)=>s+c.qty,0);
    renderChips();
    // Don't redraw underneath an open detail sheet; the next render picks up changes.
    if(first || scrim.hidden) render();
    return true;
  }

  function load(){
    if(loading || !CFG.FEED_URL) return;
    loading = true;
    fetch(CFG.FEED_URL, {cache:'no-store'})
      .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => {
        if(apply(d, false)){ lastFetch = Date.now(); try{ localStorage.setItem(CACHE_KEY, JSON.stringify(d)); }catch(e){} }
        else throw new Error('bad data');
      })
      .catch(() => {
        if(state.data){ const u=$('#updated .live'); if(u){ u.className='live stale'; u.textContent='Offline · showing ' + fmtTime(state.data.updated); } }
        else $('#view').replaceChildren(el('p','empty','The catalog could not load. Check your connection and pull down or reopen to try again.'));
      })
      .finally(() => { loading = false; });
  }

  try{ const saved = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if(saved) apply(saved, true); }catch(e){}
  if(!CFG.FEED_URL) $('#view').replaceChildren(el('p','empty','This catalog is being set up. Check back soon.'));
  load();
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && Date.now()-lastFetch > 60000) load(); });
  window.addEventListener('online', load);
  setInterval(() => { if(document.visibilityState==='visible') load(); }, 5*60000);

  // ---- Install hint ----
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let dismissed = false; try{ dismissed = localStorage.getItem('pc.installHint') === 'no'; }catch(e){}
  function hint(text, action){
    if(standalone || dismissed || document.querySelector('.install')) return;
    const box = el('div','install'); box.append(el('p', null, text));
    if(action) box.append(action);
    const x = el('button', null, '×'); x.type='button'; x.setAttribute('aria-label','Dismiss');
    const w = el('div','wrap'); w.style.padding = '12px 0 0'; w.style.paddingLeft = w.style.paddingRight = ''; w.append(box);
    x.onclick = () => { w.remove(); try{ localStorage.setItem('pc.installHint','no'); }catch(e){} };
    box.append(x);
    document.querySelector('main').prepend(w);
  }
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    const b = el('button','btn','Install'); b.type='button';
    b.onclick = () => { e.prompt(); const box = document.querySelector('.install'); if(box) box.parentNode.remove(); };
    hint('Add Plant Catalog to your home screen for one-tap access.', b);
  });
  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent);
  if(iOS) setTimeout(() => hint('Add this to your home screen: tap Share, then “Add to Home Screen.”'), 2500);

  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
